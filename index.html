<!DOCTYPE html>
<html lang="ko">
<head>
  <script>
    // ===== Supabase 설정 =====
    const SUPABASE_URL = "https://bzupxkmthuqjvcvbcfrq.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_P5MQw_kaPBX3A3xDFZHdDg_AGnYlmh-";
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 포트폴리오</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="style.css">
  <!-- 로그인한 사용자가 고른 색을 주컬러로 적용 -->
  <script src="theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">P</span>
        <span>내 포트폴리오</span>
      </a>
      <div class="header-right">
      <!-- 로그인했을 때만 보인다 -->
      <span class="welcome" id="welcome" hidden></span>
      <nav class="nav">
        <a href="index.html" class="is-active">홈</a>
        <!-- 로그인했을 때만 보인다 -->
        <a href="mypage.html" id="mypage-link" hidden>마이페이지</a>
        <!-- 로그인 상태를 확인할 때까지 숨겨서 "로그인"→"로그아웃" 깜빡임을 막는다 -->
        <a href="login.html" id="auth-link" style="visibility: hidden">로그인</a>
      </nav>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- 로그인한 사용자의 생일(월·일)이 오늘일 때만 보인다 -->
    <p class="birthday-banner" id="birthday-banner" hidden>🎂 생일 축하합니다!!!</p>

    <section class="hero">
      <h1>내 포트폴리오</h1>
      <p>제가 만든 작업들을 소개합니다.</p>
    </section>
  </main>

  <script>
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const authLink = document.getElementById("auth-link");

    // 로그인 상태면 "로그아웃"으로 바꾸고, 누르면 로그아웃 후 login.html로 이동
    client.auth.getSession().then(({ data }) => {
      if (data.session) {
        document.getElementById("mypage-link").hidden = false;

        // 가입할 때 받은 이름 (없으면 이메일로 대신)
        const user = data.session.user;
        const name = (user.user_metadata && user.user_metadata.name) || user.email;
        const welcome = document.getElementById("welcome");
        welcome.textContent = name + "님 환영합니다";
        welcome.hidden = false;

        // 생년월일("YYYY-MM-DD")의 월·일이 오늘(이 컴퓨터 기준 날짜)과 같으면 축하 메시지
        const birthdate = user.user_metadata && user.user_metadata.birthdate;
        if (typeof birthdate === "string" && /^\d{4}-\d{2}-\d{2}$/.test(birthdate)) {
          const today = new Date();
          const todayMonthDay =
            String(today.getMonth() + 1).padStart(2, "0") + "-" +
            String(today.getDate()).padStart(2, "0");
          if (birthdate.slice(5) === todayMonthDay) {
            document.getElementById("birthday-banner").hidden = false;
          }
        }

        authLink.textContent = "로그아웃";
        authLink.addEventListener("click", async (e) => {
          e.preventDefault();
          await client.auth.signOut();
          location.href = "login.html";
        });
      }
      authLink.style.visibility = "visible";
    });
  </script>
</body>
</html>
