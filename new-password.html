<!DOCTYPE html>
<html lang="ko">
<head>
  <script>
    // ===== Supabase 설정 =====
    const SUPABASE_URL = "https://bzupxkmthuqjvcvbcfrq.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_P5MQw_kaPBX3A3xDFZHdDg_AGnYlmh-";
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 비밀번호</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="style.css">
  <!-- 로그인한 사용자가 고른 색을 주컬러로 적용 -->
  <script src="theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">P</span>
        <span>내 포트폴리오</span>
      </a>
    </div>
  </header>

  <main class="auth-main">
    <div class="card">
      <h1>새 비밀번호</h1>

      <form id="password-form">
        <div class="field">
          <label for="new-password">새 비밀번호</label>
          <input type="password" id="new-password" placeholder="새 비밀번호" autocomplete="new-password" required>
        </div>
        <button type="submit" id="submit-btn" class="btn-primary">비밀번호 변경</button>
      </form>

      <p id="result" class="result"></p>
    </div>
  </main>

  <script>
    // 메일의 재설정 링크로 들어오면 주소에 담긴 정보로 자동 로그인(임시 세션)된다
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.getElementById("password-form");
    const submitBtn = document.getElementById("submit-btn");
    const result = document.getElementById("result");

    function toKoreanError(error) {
      if (error.code === "same_password") {
        return "이전과 다른 비밀번호를 입력해주세요";
      }
      if (error.code === "weak_password") {
        return "비밀번호가 너무 약해요: " + error.message;
      }
      if (error.name === "AuthSessionMissingError") {
        return "재설정 링크가 만료되었거나 올바르지 않아요. 로그인 화면에서 다시 요청해주세요";
      }
      return "실패했어요: " + error.message;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      result.classList.remove("is-success");
      result.textContent = "변경 중...";

      const { error } = await client.auth.updateUser({
        password: document.getElementById("new-password").value
      });

      if (error) {
        result.textContent = toKoreanError(error);
        return;
      }

      result.textContent = "비밀번호가 바뀌었습니다";
      result.classList.add("is-success");
      submitBtn.disabled = true;

      // 재설정용 임시 로그인을 끝내야 login.html이 index.html로 돌려보내지 않는다
      await client.auth.signOut();

      // 문구를 잠깐 보여준 뒤 이동
      setTimeout(() => location.replace("login.html"), 1500);
    });
  </script>
</body>
</html>
